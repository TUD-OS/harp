application: mandelbrot_yaml
platform: maps_exynos
type: dpm
mapping_template:
  processes: [source, sink]
  regions:
    dlp: [computeLine1, computeLine2]
  metadata: [execution_time, energy]
mappings:
  - name: mapping1_little
    processes: [ARM00, ARM01]
    regions:
      dlp:
        - [ARM03, ARM03]
    metadata: [100, 250]
  - name: mapping1_big
    processes: [ARM00, ARM01]
    regions:
      dlp:
        - [ARM04, ARM04]
    metadata: [70, 350]
  - name: mapping2
    processes: [ARM00, ARM00]
    regions:
      dlp:
        - [ARM01, ARM03]
        - [ARM02, ARM03]
    metadata: [60, 260]
  - name: mapping3
    processes: [ARM00, ARM00]
    regions:
      dlp:
        - [ARM01, ARM03]
        - [ARM02, ARM03]
        - [ARM04, ARM04]
        - [ARM05, ARM05]
        - [ARM06, ARM06]
        - [ARM07, ARM07]
    metadata: [20, 300]


