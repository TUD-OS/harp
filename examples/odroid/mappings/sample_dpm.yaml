application: mandelbrot
platform: odroid
type: dpm
mapping_template:
  processes: [gen, write]
  regions:
    region1: [process3, process4]
  par_regions:
    pr1: [calc]
  metadata: [execution_time, energy]
mappings:
  - name: mapping1
    processes: [ARM00, ARM00]
    regions:
      region1: [ARM00, ARM00]
    par_regions:
      pr1:
        - [ARM00]
    metadata: [100, 250]
  - name: mapping2
    processes: [ARM04, ARM04]
    regions:
      region1: [ARM04, ARM04]
    par_regions:
      pr1:
        - [ARM04]
    metadata: [70, 350]
  - name: mapping3
    processes: [ARM00, ARM00]
    regions:
      region1: [ARM00, ARM00]
    par_regions:
      pr1:
        - [ARM01]
        - [ARM02]
        - [ARM03]
    metadata: [60, 260]
  - name: mapping4
    processes: [ARM00, ARM00]
    regions:
      region1: [ARM00, ARM00]
    par_regions:
      pr1:
        - [ARM00]
        - [ARM01]
        - [ARM02]
        - [ARM03]
        - [ARM04]
        - [ARM05]
        - [ARM06]
        - [ARM07]
    metadata: [20, 300]
